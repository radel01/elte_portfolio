<!doctype html>
<html lang="hu">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kapcsolat - Roszkopf Adél</title>
  <link rel="icon" type="image/png" href="media/favicon.png" />
  <link rel="stylesheet" href="stilus/stilus.css" />
  <link rel="stylesheet" href="stilus/nyomtatas.css" media="print" />
</head>

<body>
  <a href="#fo-tartalom" class="skip-link">Ugrás a fő tartalomra</a>
  <header>
    <nav>
      <a href="index.html">Kezdőlap</a>
      <span class="separator">|</span>
      <a href="tapasztalat.html">Tapasztalatom</a>
      <span class="separator">|</span>
      <a href="kapcsolat.html" class="active">Kapcsolat</a>
      <button id="tema_gomb" onclick="temaValtas()">☾☼</button>
      <button id="akadalymentes_gomb" onclick="kontraszt()"><img src="media/szem.png" alt="szem szimbólum"></button>
    </nav>
  </header>

  <main id="fo-tartalom">
    <div class="kapcsolat_szekcio">
      <h1 class="huge-text kapcsolat_cim">Szeretnél többet megtudni?</h1>

      <div class="form_kontener">
        <div class="narancs_hatter"></div>
        <div class="kapcsolat_kep img_border"></div>

        <div class="form_box">
          <form action="mailto:roszkopf.adel@gmail.com" method="post" enctype="text/plain">
            <div class="form_field">
              <label for="name">Név</label>
              <input type="text" id="name" name="name" required maxlength="80" />
            </div>
            <div class="form_field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required maxlength="100" />
            </div>
            <div class="form_field textarea_field">
              <label for="message">Üzenet tartalma</label>
              <textarea id="message" name="message" rows="3" maxlength="1000"></textarea>
            </div>
            <div class="form_options_container">
              <div class="form_options">
                <div class="option_group">
                  <input type="radio" id="allasajanlat" name="category" value="allasajanlat" />
                  <label for="allasajanlat">Állásajánlat</label>
                </div>

                <div class="option_group">
                  <input type="radio" id="egyeb" name="category" value="egyeb" />
                  <label for="egyeb">Egyéb</label>
                </div>
              </div>
              <div class="checkbox_container">
                <div class="standalone_check">
                  <label for="check1">Visszahívást kérek</label>
                  <input type="checkbox" id="check1" name="check1" />
                </div>
              </div>
            </div>

            <div class="form_buttons">
              <button type="reset" class="btn_ujra">Újra</button>
              <button type="submit" class="btn_elkuld">Elküldés</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer_left">
      <a href="media/footer1.png" target="_blank">
        <img class="footer_profil" src="media/footer_profil.png" alt="Roszkopf Adél" />
      </a>
      <div class="footer_nev">ROSZKOPF<br />ADÉL LÉNA</div>
    </div>
    <div class="footer_right">
      <div class="footer_felsorolasok">
        <div class="footer_elerhetosegek">
          <h4>Elérhetőség</h4>
          <ul>
            <li><a href="mailto:roszkopf.adel@gmail.com">E-mail</a></li>
            <li><a href="tel:+36204202442">Telefon</a></li>
            <li><abbr title="2040 Budaörs, Szivárvány u. 12.">Cím</abbr></li>
          </ul>
        </div>
        <div class="footer_linkek">
          <h4>Linkek</h4>
          <ul>
            <li><a href="https://www.linkedin.com/in/adellenaroszkopf/" target="_blank">Linkedin</a></li>
            <li><a href="https://github.com/radel01" target="_blank">Github</a></li>
            <li><a href="media/Profile.pdf" target="_blank">Cv</a></li>
          </ul>
        </div>
      </div>
      <img class="footer_csillag" src="media/csillag2.png" alt="Csillag dekoráció" />
    </div>
    <div class="footer_bottom">
      Utolsó frissítés: <time datetime="2026-05-07">2026.05.07.</time>
    </div>
  </footer>
  <script>
    function temaValtas() {
      document.body.classList.toggle("sotet-mod");
    }
    function kontraszt() {
      document.body.classList.toggle("akadalymentes-mod");
    }
  </script>
</body>

</html>
