<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="media/favicon.png" />
    <link rel="stylesheet" href="stilus/stilus.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Kezdőlap</a>
        <span class="separator">|</span>
        <a href="tapasztalat.html">Tapasztalatom</a>
        <span class="separator">|</span>
        <a href="kapcsolat.html" class="active">Kapcsolat</a>
      </nav>
    </header>

    <main>
      <div class="kapcsolat_szekcio">
        <h1 class="huge-text kapcsolat_cim">Szeretnél többet megtudni?</h1>

        <div class="form_kontener">
          <div class="narancs_hatter"></div>
          <div class="kapcsolat_kep img_border"></div>

          <div class="form_box">
            <form action="#" method="post">
              <div class="form_field">
                <label for="name">Név</label>
                <input type="text" id="name" name="name" required />
              </div>

              <div class="form_field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>

              <div class="form_field textarea_field">
                <label for="message">Üzenet tartalma</label>
                <textarea id="message" name="message" rows="3"></textarea>
              </div>

              <div class="form_options_container">
                <div class="form_options">
                  <div class="option_group">
                    <input
                      type="radio"
                      id="allasajanlat"
                      name="category"
                      value="allasajanlat"
                    />
                    <label for="allasajanlat">Állásajánlat</label>
                  </div>

                  <div class="option_group">
                    <input
                      type="radio"
                      id="egyeb"
                      name="category"
                      value="egyeb"
                    />
                    <label for="egyeb">Egyéb</label>
                  </div>
                </div>
                <div class="checkbox_container">
                  <div class="standalone_check">
                    <label for="check1">Visszahívást kérek</label>
                    <input type="checkbox" id="check1" name="check1" />
                  </div>
                </div>
              </div>

              <div class="form_buttons">
                <button type="reset" class="btn_ujra">Újra</button>
                <button type="submit" class="btn_elkuld">Elküldés</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer_left">
        <img
          class="footer_profil"
          src="media/footer_profil.png"
          alt="Roszkopf Adél"
        />
        <div class="footer_nev">ROSZKOPF<br />ADÉL LÉNA</div>
      </div>
      <div class="footer_right">
        <div class="footer_felsorolasok">
          <div class="footer_elerhetosegek">
            <h4>Elérhetőség</h4>
            <ul>
              <a href="mailto:roszkopf.adel@gmail.com">
                <li>E-mail</li>
              </a>
              <a href="tel:+36204202442">
                <li>Telefon</li>
              </a>
              <abbr title="2040 Budaörs, Szivárvány u. 12.">
                <li>Cím</li>
              </abbr>
            </ul>
          </div>
          <div class="footer_linkek">
            <h4>Linkek</h4>
            <ul>
              <a href="https://www.linkedin.com/in/adellenaroszkopf/">
                <li>Linkedin</li>
              </a>
              <a href="https://github.com/radel01">
                <li>Github</li>
              </a>
              <a href="media/Profile.pdf" target="_blank">
                <li>Cv</li>
              </a>
            </ul>
          </div>
        </div>
        <img
          class="footer_csillag"
          src="media/csillag2.png"
          alt="Csillag dekoráció"
        />
      </div>
      <div class="footer_bottom">
        Utolsó frissítés: <time datetime="2026-03-15">2026.03.15.</time>
      </div>
    </footer>
  </body>
